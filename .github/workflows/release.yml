name: Release

# Pushing a v* tag releases that version to the Pi (ADR-0001): build the arm64
# image on GitHub's ARM runner, push it to GHCR, join the tailnet, and run
# scripts/deploy.sh on the Pi over SSH. Pushes and pull requests don't deploy;
# only tags do.
#
# Rolling back is deploying an older tag: re-run that tag's Release run, or
# use "Run workflow" on the Actions tab with "Use workflow from" set to the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release at a time, and never cancel one in the middle of a deploy.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    # "Run workflow" can be started from a branch too. Only tags release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the tag is a version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! $VERSION =~ ^v[0-9][A-Za-z0-9._-]{0,126}$ ]]; then
            echo "::error::$VERSION isn't a release tag like v1.2.0"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Image name and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ github.ref_name }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ github.ref_name }}
      PI_HOST: ${{ vars.PI_HOST }}
    steps:
      - uses: actions/checkout@v5

      # A temporary tag:ci device, removed when the job ends.
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.PI_HOST }}

      - name: Set up SSH to the Pi
        env:
          PI_USER: ${{ vars.PI_USER }}
          PI_SSH_KNOWN_HOSTS: ${{ vars.PI_SSH_KNOWN_HOSTS }}
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_deploy
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > ~/.ssh/pi_known_hosts
          cat > ~/.ssh/config <<EOF
          Host pi
            HostName $PI_HOST
            User $PI_USER
            IdentityFile ~/.ssh/pi_deploy
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/pi_known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 30
          EOF

      # Into ~/attendance, next to the production .env (which never leaves
      # the Pi).
      - name: Copy compose.yaml and deploy.sh to the Pi
        run: scp compose.yaml scripts/deploy.sh pi:attendance/

      # Pull, migrate, then restart. A failed migration stops here with the
      # previous version still serving (scripts/deploy.sh).
      - name: Deploy ${{ github.ref_name }}
        run: ssh pi "bash attendance/deploy.sh '$VERSION'"

      - name: Summary
        run: echo "Deployed **$VERSION** to https://$PI_HOST" >> "$GITHUB_STEP_SUMMARY"
