name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://attendance:attendance@localhost:5432/attendance
      WORKPLACE_TIME_ZONE: Europe/London
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # The production stack from compose.yaml: Postgres, migrate, then the
      # app image built from the Dockerfile. .env comes from .env.example.
      - name: Start the Compose stack
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests against the Compose stack
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

      - name: Compose logs
        if: failure()
        run: docker compose logs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The Pi runs arm64: check the image still builds there, natively.
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build the production image
        run: docker build .
