# Local development stack. For now this is only Postgres; the app, migrate
# and backup services arrive with the production image (ticket 13).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
      POSTGRES_DB: attendance
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
